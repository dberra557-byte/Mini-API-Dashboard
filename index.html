<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>API Mini Apps Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body { font-family: Arial; background: #f9f9f9; margin:0; padding:20px; }
  h1 { text-align:center; margin-bottom:30px; font-size:2em; color:#333; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:20px; }
  .card { background:white; padding:15px; border-radius:10px; box-shadow:0 3px 8px rgba(0,0,0,0.12); display:flex; flex-direction:column; align-items:center; }
  .card h3 { margin-bottom:10px; color:#444; text-align:center; }
  img { max-width:100%; border-radius:6px; margin-bottom:10px; }
  input, button { padding:8px; margin-top:5px; width:100%; font-size:0.9em; }
  ul { padding-left:20px; width:100%; }
  p { text-align:center; font-weight:500; }
  a { color:#1a73e8; text-decoration:none; }
  a:hover { text-decoration:underline; }
</style>
</head>

<body>
<h1>API Mini Apps Dashboard</h1>

<div class="grid">

  <div class="card">
    <h3>🐶 Random Dog</h3>
    <a id="dogLink" target="_blank"><img id="dogImg" alt="Random Dog"></a>
  </div>

  <div class="card">
    <h3>🐱 Random Cat</h3>
    <a id="catLink" target="_blank"><img id="catImg" alt="Random Cat"></a>
  </div>

  <div class="card">
    <h3>🌤️ Weather (New York)</h3>
    <p id="weather">Loading...</p>
  </div>

  <div class="card">
    <h3>💱 Crypto Prices</h3>
    <p id="currency">Loading...</p>
  </div>

  <div class="card">
    <h3>🎬 Popular Shows</h3>
    <ul id="movies"></ul>
  </div>

  <div class="card">
    <h3>🧑‍💻 GitHub User</h3>
    <input id="ghUser" placeholder="Enter username">
    <button onclick="loadGitHub()">Search</button>
    <p id="github"></p>
  </div>

  <div class="card">
    <h3>😂 Random Joke</h3>
    <p id="joke">Loading...</p>
  </div>

  <div class="card">
    <h3>📚 Random Advice</h3>
    <p id="advice">Loading...</p>
  </div>

</div>

<script>
  // 1. Random Dog
  fetch("https://dog.ceo/api/breeds/image/random")
    .then(r => r.json())
    .then(d => {
      document.getElementById("dogImg").src = d.message;
      document.getElementById("dogLink").href = d.message; // clickable link to full image
    });

  // 2. Random Cat
  fetch("https://api.thecatapi.com/v1/images/search")
    .then(r => r.json())
    .then(d => {
      document.getElementById("catImg").src = d[0].url;
      document.getElementById("catLink").href = d[0].url; // clickable link to full image
    });

  // 3. Weather
  fetch("https://api.open-meteo.com/v1/forecast?latitude=40.71&longitude=-74.01&current_weather=true")
    .then(r => r.json())
    .then(d => {
      document.getElementById("weather").textContent =
        `Temp: ${d.current_weather.temperature}°C | Wind: ${d.current_weather.windspeed} km/h`;
    });

  // 4. Crypto Prices
  fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd")
    .then(r => r.json())
    .then(d => {
      document.getElementById("currency").textContent =
        `BTC → $${d.bitcoin.usd} | ETH → $${d.ethereum.usd}`;
    });

  // 5. Popular Shows (clickable)
  fetch("https://api.tvmaze.com/shows")
    .then(r => r.json())
    .then(d => {
      d.slice(0,5).forEach(show => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = show.url;
        a.target = "_blank";
        a.textContent = show.name;
        li.appendChild(a);
        document.getElementById("movies").appendChild(li);
      });
    });

  // 6. GitHub User (clickable)
  function loadGitHub() {
    const user = document.getElementById("ghUser").value;
    if(!user) return;
    fetch(`https://api.github.com/users/${user}`)
      .then(r => r.json())
      .then(d => {
        const githubEl = document.getElementById("github");
        githubEl.innerHTML = `Name: ${d.name || "N/A"} | Repos: ${d.public_repos || 0} <br>`;
        const link = document.createElement("a");
        link.href = d.html_url;
        link.target = "_blank";
        link.textContent = "View Profile";
        githubEl.appendChild(link);
      });
  }

  // 7. Random Joke
  fetch("https://v2.jokeapi.dev/joke/Any?type=single")
    .then(r => r.json())
    .then(d => document.getElementById("joke").textContent = d.joke);

  // 8. Random Advice (clickable)
  fetch("https://api.adviceslip.com/advice")
    .then(r => r.json())
    .then(d => {
      const adviceEl = document.getElementById("advice");
      adviceEl.textContent = d.slip.advice + " ";
      const link = document.createElement("a");
      link.href = `https://api.adviceslip.com/advice`;
      link.target = "_blank";
      link.textContent = "(Source)";
      adviceEl.appendChild(link);
    });

</script>

</body>
</html>
